# Fly.io.  flyctl launch --no-deploy  then  flyctl deploy
app = "oiltrace-ai"
primary_region = "ams"            # close to the North Sea default AOI

[build]
  dockerfile = "Dockerfile"

[env]
  OILTRACE_DATA_DIR = "/data"
  OILTRACE_REGION = "north-sea"
  AIS_SOURCE = "live"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false      # the AIS collector must keep running
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

# Persistent database. Create once:  flyctl volumes create oiltrace_data --size 1
[[mounts]]
  source = "oiltrace_data"
  destination = "/data"
